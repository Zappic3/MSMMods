# .github/workflows/release-mods.yml
name: Release Changed Mods

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.changed.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed mod folders
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '/' \
            | cut -d'/' -f1 \
            | sort -u \
            | grep -v '^\.')
          echo "Changed folders: $CHANGED"
          JSON=$(echo "$CHANGED" | grep -v '^$' | jq -R . | jq -sc .)
          echo "mods=$JSON" >> $GITHUB_OUTPUT

  release-mod:
    needs: detect-changes
    if: needs.detect-changes.outputs.mods != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        mod: ${{ fromJson(needs.detect-changes.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not a mod directory
        id: check
        run: |
          if [ ! -d "${{ matrix.mod }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.check.outputs.skip == 'false'
        id: version
        run: |
          MANIFEST="${{ matrix.mod }}/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "No manifest.json found in ${{ matrix.mod }}, skipping."
            exit 1
          fi

          VERSION=$(jq -r '.version' "$MANIFEST")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if echo "$COMMIT_MSG" | grep -q '\[major\]'; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif echo "$COMMIT_MSG" | grep -q '\[minor\]'; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          jq --arg v "$NEW_VERSION" '.version = $v' "$MANIFEST" > tmp.json && mv tmp.json "$MANIFEST"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.mod }}/manifest.json"
          git commit -m "chore: bump ${{ matrix.mod }} to v${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      - name: Zip mod (excluding version.txt)
        if: steps.check.outputs.skip == 'false'
        run: |
          SAFE_NAME=$(echo "${{ matrix.mod }}" | tr ' ' '_')
          ZIP_NAME="${SAFE_NAME}-v${{ steps.version.outputs.new_version }}.zip"
          zip -r "$ZIP_NAME" "${{ matrix.mod }}/" --exclude "${{ matrix.mod }}/version.txt"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_ENV

      - name: Create per-mod release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${SAFE_NAME}-v${{ steps.version.outputs.new_version }}" "$ZIP_NAME" \
            --title "${{ matrix.mod }} v${{ steps.version.outputs.new_version }}" \
            --notes "Release for ${{ matrix.mod }} version ${{ steps.version.outputs.new_version }}"

      - name: Upload zip as artifact for latest release job
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}
          path: ${{ env.ZIP_NAME }}

  update-latest-release:
    needs: [detect-changes, release-mod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all newly built zips
        uses: actions/download-artifact@v4
        with:
          path: new-zips/
          merge-multiple: true

      - name: Download existing zips from latest release (if it exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p existing-zips/
          # Download all assets from the current 'latest' release, if it exists
          if gh release view latest --json assets -q '.assets[].name' 2>/dev/null; then
            gh release download latest --dir existing-zips/ 2>/dev/null || true
          fi

      - name: Merge zips (new ones overwrite old ones)
        run: |
          mkdir -p final-zips/
          # Start with existing zips from the old latest release.
          # Each zip is named ModName-vX.Y.Z.zip; strip the version to get the mod name
          # so newer versions replace older ones.
          for f in existing-zips/*.zip; do
            [ -f "$f" ] || continue
            MOD_NAME=$(basename "$f" | sed 's/-v[0-9].*//')
            cp "$f" "final-zips/${MOD_NAME}.zip"
          done
          # Overwrite with the freshly built zips (these are the updated mods)
          for f in new-zips/*.zip; do
            [ -f "$f" ] || continue
            MOD_NAME=$(basename "$f" | sed 's/-v[0-9].*//')
            cp "$f" "final-zips/${MOD_NAME}.zip"
          done

      - name: Delete and recreate latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest final-zips/*.zip \
            --title "Latest (all mods)" \
            --notes "Always contains the most recent version of every mod. Updated automatically on each push." \
            --latest=false
